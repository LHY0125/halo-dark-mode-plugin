plugins {
    id 'base'
    id "com.github.node-gradle.node" version "7.1.0"
}

group 'top.liuhangyv.darkmode.ui'

node {
    // 使用系统安装的 Node.js，避免 Gradle 下载的本地 Node 目录缺失时失败
    download = false
}

tasks.named('pnpmInstall') {
    // Gradle 9.4 对 pnpm 生成的 node_modules 做输出快照时会引用已删除的旧文件并报
    // NoSuchFileException；关闭状态跟踪，每次构建幂等重跑 pnpm install（耗时数秒）
    doNotTrackState('pnpm node_modules layout is managed by pnpm')
}

tasks.named('pnpmSetup') {
    // Windows 上 node-gradle 通过 npm.cmd 安装 pnpm 在 Gradle 子进程中不可用；
    // 本地已缓存 pnpm（ui/.gradle/pnpm/pnpm-latest）时跳过安装，CI 全新环境仍正常执行
    onlyIf { !project.file('.gradle/pnpm/pnpm-latest/pnpm.cmd').exists() }
}

tasks.register('pnpmBuild', PnpmTask) {
    group = 'build'
    description = 'Build the UI project using pnpm'
    args = ['build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(
        dir: layout.projectDirectory,
        includes: ['*.cjs', '*.ts', '*.js', '*.json', '*.yaml']))
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.register('pnpmCheck', PnpmTask) {
    group = 'verification'
    description = 'Run unit tests for the UI project using pnpm'
    args = ['test:unit']
    dependsOn tasks.named('pnpmInstall')
}

tasks.named('check') {
    dependsOn tasks.named('pnpmCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('pnpmBuild')
}
